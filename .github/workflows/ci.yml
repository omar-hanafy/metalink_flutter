name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test-stable:
    name: Test on stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Version channel check
        env:
          TARGET_LANE: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d "\"'")
          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          prerelease_pattern='^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$'

          if [[ "$TARGET_LANE" == 'main' && ! "$version" =~ $stable_pattern ]]; then
            echo "main requires a stable semantic version, got $version."
            exit 1
          fi
          if [[ "$TARGET_LANE" == 'dev' && ! "$version" =~ $prerelease_pattern ]]; then
            echo "dev requires a prerelease semantic version, got $version."
            exit 1
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No tests to run."
          fi

  test-beta:
    name: Test on beta
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Flutter (beta)
        uses: subosito/flutter-action@v2
        with:
          channel: beta
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No tests to run."
          fi

  pana:
    name: Pana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Install pana
        run: dart pub global activate pana 0.23.14
      - name: Install webp tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Run pana
        run: pana --exit-code-threshold 0 .
